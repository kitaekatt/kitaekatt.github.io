# MONKEY BAITING -- STRATEGIES: the primitive decision methods.
# Canonical model: each decision method is a STRATEGY; all BOTS are expressed
# as weight and proximity data over the available strategies (data/bots.yaml).
# Strategies are code + params here; bots are pure data there. Only
# strategies decide actions.
#
# kinds (implemented in logic.js):
#   default -- the tuned house AI; per-character params live in each
#              character's own `ai:` block (data/characters/*.yaml)
#   spam    -- spam(move): approach until the move can reach, then use ONLY
#              that move on cooldown; never blocks or jumps. Referenced from
#              bot tables as spam-<move> (resolved per character).
#   random  -- uniform among legal actions on a decision tick; seeded
#   passive -- never attacks; block_chance on threat + maintain_distance.
#              The offense-measurement dummy and the "plays correctly but
#              rarely" ingredient for easy bots.
#   perfect -- plays a solved equilibrium policy (test/solver.js /
#              solver/solve.py); the policy object is supplied at match
#              setup, per matchup. Policy files are NOT committed.

strategies:
  default:
    kind: default

  spam:
    kind: spam
    params:
      reach_margin: 6        # press within this many px inside the move's reach
      leap_reach_bonus: 40   # extra reach credited to leaping moves (WINDPIPE)
      unranged_reach: 999    # hazard/yank/retreat moves press from anywhere

  random:
    kind: random
    params:
      decision_interval: 10  # frames between fresh picks
      move_weight: 0.5       # mass on attacks vs movement/defence

  passive:
    kind: passive
    params:
      block_chance: 0.5      # chance to block when a threat is winding up
      maintain_distance: 60  # walk to hold this gap (0 = stand still)

  perfect:
    kind: perfect
