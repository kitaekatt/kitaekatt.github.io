<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MONKEY BAITING &mdash; no quarrel but the chain</title>
<!--
  MONKEY BAITING v10 - the shipped game on the C/Flecs core (stage S7).

  This page is a PRESENTATION SHELL. It owns pixels, keys and screen flow, and
  nothing else: every gameplay number comes out of the WASM build of
  sandboxes/monkey-baiting/systems/native, which is the same code the
  tournament simulator runs. There is no game logic in JavaScript here
  (architecture ruling 1.4(b)). The retired v9 game at web/monkey-baiting/ is
  the reference for what this must PRESENT, never for what it must compute.

  CACHE BUSTING (root CLAUDE.md decision 22): every script tag carries ?v=f82afdc
  Bump BOTH the stamp below and every ?v= together when publishing, or GitHub
  Pages will serve a mix of old and new files and the failure will look like a
  code bug.
-->
<style>
  html, body {
    margin: 0; padding: 0; background: #0b0908; overflow: hidden;
    height: 100%; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  canvas#game {
    position: fixed; display: block;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  .chrome {
    position: fixed; z-index: 10; font: 11px "Courier New", monospace;
    color: #7a7264; background: rgba(20,17,16,0.7); border: 1px solid #3a362e;
    padding: 6px 10px; cursor: pointer; letter-spacing: 1px;
  }
  .chrome:active { color: #e8ddc0; }
  #padToggle { top: 8px; right: 8px; }
  #version {
    position: fixed; bottom: 4px; right: 6px; z-index: 10;
    font: 10px "Courier New", monospace; color: #57524a; pointer-events: none;
  }
  #status {
    position: fixed; inset: 0; z-index: 20; display: flex;
    align-items: center; justify-content: center;
    font: 12px "Courier New", monospace; color: #7a7264;
    background: #0b0908; text-align: center; padding: 0 24px;
  }
  /* on-screen controller: thumbs-first sizing (>=48px targets) */
  #pad { position: fixed; inset: 0; z-index: 5; pointer-events: none; display: none; }
  #pad .btn {
    position: absolute; pointer-events: auto; box-sizing: border-box;
    width: 58px; height: 58px; border-radius: 10px;
    background: rgba(35,33,28,0.55); border: 2px solid rgba(122,114,100,0.6);
    color: #b8ae96; font: bold 13px Georgia, serif; letter-spacing: 1px;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  #pad .btn.on { background: rgba(201,162,39,0.35); border-color: #c9a227; color: #e8ddc0; }
  #pad .b-left  { left: 14px;  bottom: 24px; }
  #pad .b-right { left: 140px; bottom: 24px; }
  #pad .b-jump  { left: 77px;  bottom: 88px; }
  #pad .b-light   { right: 140px; bottom: 24px; background: rgba(60,40,30,0.55); }
  #pad .b-heavy   { right: 76px;  bottom: 56px; background: rgba(60,40,30,0.55); }
  #pad .b-special { right: 12px;  bottom: 88px; background: rgba(88,30,22,0.55); }
  #pad .b-block   { right: 12px;  bottom: 20px; background: rgba(35,45,55,0.55); }
</style>
</head>
<body>
<canvas id="game" width="400" height="225"></canvas>

<button id="padToggle" class="chrome" type="button">PAD</button>
<!-- tools/publish.py and tools/build-wasm.sh both rewrite the CONTENT of this
     exact div (id="version") to stamp the version and the source commit; the
     commit is also what publish.py reads back to refuse republishing an
     unchanged tree. shell.js appends the core's sim_version, it does not
     replace the stamp. -->
<div id="version">v (f82afdc)</div>

<div id="status">lighting the booth&hellip;</div>

<div id="pad">
  <div class="btn b-left"  data-act="left">&#9668;</div>
  <div class="btn b-right" data-act="right">&#9658;</div>
  <div class="btn b-jump"  data-act="jump">&#9650;</div>
  <div class="btn b-light"   data-act="light">L</div>
  <div class="btn b-heavy"   data-act="heavy">H</div>
  <div class="btn b-special" data-act="special">S</div>
  <div class="btn b-block"   data-act="block">B</div>
</div>

<script src="chars.js?v=f82afdc"></script>
<script src="shell.js?v=f82afdc"></script>
<script src="flecs-ecs.js?v=f82afdc"></script>
<script>
(function () {
  var status = document.getElementById('status');

  function fail(msg) {
    /* No silent fallback (root CLAUDE.md decision 12): the page says what went
     * wrong rather than showing an empty booth. */
    status.style.display = 'flex';
    status.style.color = '#d24a33';
    status.textContent = msg;
    console.error(msg);
  }

  var padOn = false;
  document.getElementById('padToggle').addEventListener('click', function () {
    padOn = !padOn;
    document.getElementById('pad').style.display = padOn ? 'block' : 'none';
    this.textContent = padOn ? 'PAD: ON' : 'PAD';
  });
  /* Touch devices get the pad up front. */
  if (('ontouchstart' in window) || navigator.maxTouchPoints > 0) {
    document.getElementById('padToggle').click();
  }

  if (typeof FlecsECS !== 'function') {
    fail('flecs-ecs.js did not load - build with tools/build-wasm.sh monkey-baiting');
    return;
  }

  /* Propagate this page's flecs-ecs.js ?v= stamp to the .wasm/.data fetches.
   * The js manifest addresses the .data bundle by byte offset, so a cached
   * .data paired with a newer .js reads garbage YAML (seen live as
   * "MbSpawnRequest is not registered"). publish.py rewrites every ?v= per
   * publish; without a stamp (local serve) nothing is appended. */
  var vMatch = null;
  document.querySelectorAll('script[src]').forEach(function (s) {
    var m = s.getAttribute('src').match(/flecs-ecs\.js\?v=([A-Za-z0-9._-]+)/);
    if (m) { vMatch = m[1]; }
  });
  FlecsECS(vMatch ? {
    locateFile: function (path, prefix) { return prefix + path + '?v=' + vMatch; }
  } : {}).then(function (Module) {
    try {
      window.MB.boot(Module);
      status.style.display = 'none';
    } catch (e) {
      fail(String(e && e.message || e));
    }
  }).catch(function (e) {
    fail('the WASM core failed to load: ' + (e && e.message || e));
  });
})();
</script>
</body>
</html>
