<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Non-Abelian Tag</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000000; color: #e0e0e0; font-family: monospace; overflow: hidden; }
#ui { position: fixed; top: 8px; left: 8px; z-index: 10; font-size: 13px; }
#ui button, #ui select { margin: 0 4px; padding: 4px 12px; background: #333; color: #e0e0e0;
    border: 1px solid #555; cursor: pointer; font-family: monospace; font-size: 13px; }
#ui button:hover, #ui select:hover { background: #444; }
#ui button.active { background: #2a6; color: #fff; }
#info { position: fixed; top: 8px; right: 8px; z-index: 10; font-size: 12px;
    text-align: right; opacity: 0.7; }
canvas { display: block; }
#loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 18px; }
#version { position: fixed; bottom: 4px; right: 8px; font-size: 11px; opacity: 0.4; }
</style>
</head>
<body>
<div id="loading">Loading WASM...</div>
<div id="ui" style="display:none">
    <button id="btnUnspawn">- Unit</button>
    <button id="btnSpawn">+ Unit</button>
    <button id="btnStep">Step</button>
    <button id="btnPlay">Play</button>
    <select id="speedSelect" title="Play rate">
        <option value="1">1x</option>
        <option value="2">2x</option>
        <option value="4">4x</option>
        <option value="8">8x</option>
        <option value="16">16x</option>
    </select>
    <button id="btnReset">Reset</button>
    <span id="turnLabel">Turn: 0</span>
</div>
<div id="info" style="display:none">
    <div id="unitCount"></div>
    <div id="transformCount"></div>
</div>
<canvas id="c"></canvas>
<div id="version">v (93392e3)</div>

<!-- Shared render code (CLAUDE.md "Browser Client Rendering Policy") -->
<script src="lib/render.js"></script>
<script src="lib/sprites.js"></script>
<script src="lib/draw-unit.js"></script>
<script>
// CLIENT-PARITY: ignore updateViewUnits  — reads WASM cwrap exports, no REST equivalent
// CLIENT-PARITY: ignore updatePendingSpawns  — reads WASM cwrap exports
// CLIENT-PARITY: ignore refreshSpawnButton  — local helper (REST sets button inline)
// ── Config ──────────────────────────────────────────────────────────
const TARGET_TURN_MS = 1600;
const CELL_MIN = 4;

// Phase diagram matches the REST client so the same drawUnit animations work.
const TIMELINE = {
    movement:  { start: 0.0,   end: 0.375 },
    rotate:    { start: 0.375, end: 0.5 },
    tag:       { start: 0.5,   end: 0.625 },
    transform: { start: 0.625, end: 1.0 },
};

// Color palette — defaults from lib/render.js. The WASM bundle has no server
// to load colors.yaml from; if needed the color file can be inlined later.
const COL = Object.assign({}, COL_DEFAULTS);

// ── State ───────────────────────────────────────────────────────────
let engine = null;
let mapW = 0, mapH = 0;
let CELL = 32;
let viewUnits = {};
let pendingSpawns = [];
let playing = false;
let animating = false;
let animStartTime = 0;
let animDurationMs = TARGET_TURN_MS;
let turnTransformCount = 0;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ── View units (WASM-export side) ───────────────────────────────────
// The WASM exports today provide: x, y, facing, caps, transformed, stunned,
// entity_id, block_*_cd. They do NOT expose intent/activation markers, evade
// turns, or per-direction tag flags. drawUnit() in lib/draw-unit.js
// feature-detects these — undefined fields suppress their animations cleanly.
function updateViewUnits() {
    if (!engine) return;
    const count = engine.get_unit_count();
    const seen = new Set();
    turnTransformCount = 0;

    for (let i = 0; i < count; i++) {
        const eid = engine.get_unit_entity_id(i);
        seen.add(eid);

        let vu = viewUnits[eid];
        if (!vu) {
            const nx = engine.get_unit_x(i);
            const ny = engine.get_unit_y(i);
            vu = { eid, x: nx, y: ny, prevX: nx, prevY: ny,
                   facing: 0, prevFacing: 0,
                   caps: 0, prevCaps: 0,
                   gained: 0, lost: 0,
                   transformed: false, stunned: false,
                   blockFwdTurns: 0, blockRightTurns: 0, blockLeftTurns: 0, evadeTurns: 0 };
            viewUnits[eid] = vu;
        }

        vu.prevX = vu.x; vu.prevY = vu.y;
        vu.prevFacing = vu.facing;
        vu.prevCaps = vu.caps;

        vu.x = engine.get_unit_x(i);
        vu.y = engine.get_unit_y(i);
        vu.facing = engine.get_unit_facing(i);
        vu.caps = engine.get_unit_caps(i);
        vu.transformed = engine.get_unit_transformed(i) === 1;
        vu.stunned = engine.get_unit_stunned(i) === 1;

        // Translate the WASM 0/1 cooldown booleans into the {turns} convention
        // drawUnit expects. We only know "in cooldown now or not", so map true→1.
        // Without the engine exposing a turns counter, we can't distinguish
        // "fired this turn" (2) from "still cooling down" (1) — drawUnit will
        // render cooldown tint either way, which is correct visually.
        vu.blockFwdTurns   = engine.get_unit_block_fwd_cd(i)   === 1 ? 1 : 0;
        vu.blockRightTurns = engine.get_unit_block_right_cd(i) === 1 ? 1 : 0;
        vu.blockLeftTurns  = engine.get_unit_block_left_cd(i)  === 1 ? 1 : 0;
        vu.evadeTurns = 0;

        vu.gained = vu.caps & ~vu.prevCaps;
        vu.lost = vu.prevCaps & ~vu.caps;

        if (vu.transformed) turnTransformCount++;

        // Toroidal wrap: snap prev to current if jumped > half map.
        if (Math.abs(vu.x - vu.prevX) > mapW / 2) vu.prevX = vu.x;
        if (Math.abs(vu.y - vu.prevY) > mapH / 2) vu.prevY = vu.y;
    }

    for (const eid of Object.keys(viewUnits)) {
        if (!seen.has(Number(eid))) delete viewUnits[eid];
    }
}

function updatePendingSpawns() {
    pendingSpawns = [];
    if (!engine) return;
    const count = engine.get_pending_count();
    for (let i = 0; i < count; i++) {
        pendingSpawns.push({
            x: engine.get_pending_x(i),
            y: engine.get_pending_y(i),
            caps: engine.get_pending_caps(i),
        });
    }
}

// ── Render loop ─────────────────────────────────────────────────────
function render(timestamp) {
    if (!engine) { requestAnimationFrame(render); return; }

    let tMove = 1, tRotate = 1, tTag = 1, tTransform = 1;
    while (animating) {
        const elapsed = timestamp - animStartTime;
        const p = Math.min(1, elapsed / animDurationMs);
        tMove = phaseT(p, TIMELINE.movement);
        tRotate = phaseT(p, TIMELINE.rotate);
        tTag = phaseT(p, TIMELINE.tag);
        tTransform = phaseT(p, TIMELINE.transform);

        if (p < 1) break;
        animating = false;
        if (!playing) break;
        startTurn();
    }

    CELL = resizeCanvas(canvas, mapW, mapH, CELL_MIN);
    const origin = drawGrid(ctx, canvas, mapW, mapH, CELL, COL);
    const phases = { tMove, tRotate, tTag, tTransform };
    for (const eid of Object.keys(viewUnits))
        drawUnit(ctx, viewUnits[eid], origin, CELL, phases);
    if (!playing) drawPendingSpawns(ctx, origin, pendingSpawns, CELL, COL);

    document.getElementById('turnLabel').textContent = `Turn: ${engine.get_turn()}`;
    document.getElementById('unitCount').textContent = `Units: ${engine.get_unit_count()}`;
    document.getElementById('transformCount').textContent = `Transformed: ${turnTransformCount}`;

    requestAnimationFrame(render);
}

function startTurn() {
    if (!engine) return;
    if (engine.is_game_over()) {
        playing = false;
        updateButtons();
        return;
    }

    engine.turn();
    document.getElementById('btnSpawn').textContent = '+ Unit';
    updateViewUnits();
    updatePendingSpawns();

    animDurationMs = TARGET_TURN_MS / getPlayRate();
    animStartTime = performance.now();
    animating = true;
}

// ── Controls ────────────────────────────────────────────────────────
function getPlayRate() {
    return parseInt(document.getElementById('speedSelect').value, 10) || 1;
}

function updateButtons() {
    document.getElementById('btnPlay').classList.toggle('active', playing);
}

document.getElementById('btnReset').onclick = () => {
    if (!engine) return;
    playing = false;
    animating = false;
    updateButtons();
    const params = new URLSearchParams(window.location.search);
    const config = params.get('config') || 'default';
    engine.init_with_config(config);
    mapW = engine.get_map_x();
    mapH = engine.get_map_y();
    viewUnits = {};
    updateViewUnits();
    updatePendingSpawns();
    refreshSpawnButton();
};

function refreshSpawnButton() {
    const count = pendingSpawns.length;
    document.getElementById('btnSpawn').textContent = count > 0
        ? `+ Unit (${count})` : '+ Unit';
}

document.getElementById('btnSpawn').onclick = () => {
    if (!engine) return;
    engine.spawn_unit();
    updatePendingSpawns();
    refreshSpawnButton();
};

document.getElementById('btnUnspawn').onclick = () => {
    if (!engine) return;
    engine.unspawn_unit();
    updatePendingSpawns();
    refreshSpawnButton();
};

document.getElementById('btnStep').onclick = () => {
    playing = false;
    updateButtons();
    if (!animating) startTurn();
};

document.getElementById('btnPlay').onclick = () => {
    playing = !playing;
    updateButtons();
    if (playing && !animating) startTurn();
};

window.addEventListener('resize', () => { CELL = resizeCanvas(canvas, mapW, mapH, CELL_MIN); });
window.addEventListener('error', (e) => showFatal(e.error || e.message));
window.addEventListener('unhandledrejection', (e) => showFatal(e.reason));

// ── Init ────────────────────────────────────────────────────────────
async function init() {
    const Module = await FlecsECS();

    engine = {
        init: Module.cwrap('wasm_init', 'number', []),
        init_with_config: Module.cwrap('wasm_init_with_config', 'number', ['string']),
        turn: Module.cwrap('wasm_turn', 'number', []),
        get_turn: Module.cwrap('wasm_get_turn', 'number', []),
        get_unit_count: Module.cwrap('wasm_get_unit_count', 'number', []),
        get_unit_x: Module.cwrap('wasm_get_unit_x', 'number', ['number']),
        get_unit_y: Module.cwrap('wasm_get_unit_y', 'number', ['number']),
        get_unit_facing: Module.cwrap('wasm_get_unit_facing', 'number', ['number']),
        get_unit_caps: Module.cwrap('wasm_get_unit_caps', 'number', ['number']),
        get_unit_transformed: Module.cwrap('wasm_get_unit_transformed', 'number', ['number']),
        get_unit_stunned: Module.cwrap('wasm_get_unit_stunned', 'number', ['number']),
        get_unit_entity_id: Module.cwrap('wasm_get_unit_entity_id', 'number', ['number']),
        get_unit_block_fwd_cd: Module.cwrap('wasm_get_unit_block_fwd_cd', 'number', ['number']),
        get_unit_block_right_cd: Module.cwrap('wasm_get_unit_block_right_cd', 'number', ['number']),
        get_unit_block_left_cd: Module.cwrap('wasm_get_unit_block_left_cd', 'number', ['number']),
        get_map_x: Module.cwrap('wasm_get_map_x', 'number', []),
        get_map_y: Module.cwrap('wasm_get_map_y', 'number', []),
        is_game_over: Module.cwrap('wasm_is_game_over', 'number', []),
        spawn_unit: Module.cwrap('wasm_spawn_unit', 'number', []),
        unspawn_unit: Module.cwrap('wasm_unspawn_unit', 'number', []),
        get_pending_count: Module.cwrap('wasm_get_pending_count', 'number', []),
        get_pending_x: Module.cwrap('wasm_get_pending_x', 'number', ['number']),
        get_pending_y: Module.cwrap('wasm_get_pending_y', 'number', ['number']),
        get_pending_caps: Module.cwrap('wasm_get_pending_caps', 'number', ['number']),
    };

    const params = new URLSearchParams(window.location.search);
    const config = params.get('config') || 'default';

    document.getElementById('loading').textContent = 'Initializing engine...';
    const ok = engine.init_with_config(config);
    if (!ok) {
        document.getElementById('loading').textContent = 'Failed to initialize engine';
        return;
    }

    mapW = engine.get_map_x();
    mapH = engine.get_map_y();

    document.getElementById('loading').textContent = 'Loading sprites...';
    await loadSprites('assets/bitmaps');
    buildTints(COL);

    document.getElementById('loading').style.display = 'none';
    document.getElementById('ui').style.display = '';
    document.getElementById('info').style.display = '';

    CELL = resizeCanvas(canvas, mapW, mapH, CELL_MIN);

    updateViewUnits();
    updatePendingSpawns();
    refreshSpawnButton();

    requestAnimationFrame(render);
}

const script = document.createElement('script');
script.src = './flecs-ecs.js';
script.onload = init;
document.head.appendChild(script);
</script>
</body>
</html>
